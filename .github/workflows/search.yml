name: Living search

# Searches the open bibliographic APIs (arXiv, OpenAlex, Semantic Scholar) with a pillar's query string,
# deduplicates against everything already screened, labels the new records with the current screening prompt
# through Amazon Bedrock, and opens a pull request carrying the records, labels and the maintainer's review
# workbook. Nothing reaches the site until the maintainer applies the workbook and merges.
#
# Modes: count  - report hit counts only (no files changed, no PR)
#        screen - download, ingest, label, build the review workbook, open a PR
# The monthly schedule runs pillar 1 in screen mode; other pillars are run on demand until each has had its
# first manual run.

on:
  schedule:
    - cron: "17 3 15 * *"        # 15th of each month, 03:17 UTC
  workflow_dispatch:
    inputs:
      pillar:
        description: Pillar number (1-5)
        default: "1"
      databases:
        description: Comma-separated subset of arxiv,openalex,semanticscholar
        default: arxiv,openalex,semanticscholar
      mode:
        description: count or screen
        default: count

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  PILLAR: ${{ github.event.inputs.pillar || '1' }}
  DATABASES: ${{ github.event.inputs.databases || 'arxiv,openalex,semanticscholar' }}
  MODE: ${{ github.event.inputs.mode || 'screen' }}

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install boto3 openpyxl

      - name: Hit counts
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          set -o pipefail
          rc=0
          python3 -u search.py --pillar "$PILLAR" --databases "$DATABASES" --count-only 2>&1 | tee counts.txt || true
          rc=${PIPESTATUS[0]}
          { echo "### Hit counts (pillar $PILLAR)"; echo '```'; cat counts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat counts.txt
          exit $rc

      - name: Download records
        if: env.MODE == 'screen'
        env:
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          rc=0
          echo "RUN_ID=$(date -u +%Y-%m-%d)_p$PILLAR" >> "$GITHUB_ENV"
          python3 search.py --pillar "$PILLAR" --databases "$DATABASES" --run "$(date -u +%Y-%m-%d)_p$PILLAR" > download.txt 2>&1 || rc=$?
          { echo "### Download"; echo '```'; cat download.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat download.txt
          exit $rc

      - name: Ingest and deduplicate
        if: env.MODE == 'screen'
        run: |
          set -o pipefail
          rc=0
          python3 -u ingest.py --run "$RUN_ID" --pillar "$PILLAR" --database api 2>&1 | tee ingest.txt || true
          rc=${PIPESTATUS[0]}
          { echo "### Ingest"; echo '```'; cat ingest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat ingest.txt
          exit $rc

      - name: Configure AWS credentials (OIDC)
        if: env.MODE == 'screen'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_SEARCH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: AI title/abstract labelling
        if: env.MODE == 'screen'
        env:
          MODEL_ID: ${{ vars.SCREEN_MODEL_ID || 'eu.anthropic.claude-haiku-4-5-20251001-v1:0' }}
        run: |
          set -o pipefail
          rc=0
          python3 -u label.py --run "$RUN_ID" --prompt ta-screen-v4 2>&1 | tee label_full.txt || true
          rc=${PIPESTATUS[0]}
          tail -20 label_full.txt > label.txt
          { echo "### Labelling"; echo '```'; cat label.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat label.txt
          exit $rc

      - name: Build the review workbook
        if: env.MODE == 'screen'
        run: |
          set -o pipefail
          rc=0
          python3 -u review.py build --run "$RUN_ID" 2>&1 | tee review.txt || true
          rc=${PIPESTATUS[0]}
          { echo "### Review workbook"; echo '```'; cat review.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat review.txt
          exit $rc

      - name: Open pull request
        if: env.MODE == 'screen'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "agent-precog search"
          git config user.email "search@agent-precog.org"
          BR="search/$RUN_ID-${{ github.run_number }}"   # unique per run, so a repeated run never collides with an open PR
          git checkout -b "$BR"
          git add data/raw data/screening data/search_log.csv data/decisions.csv
          git commit -m "Search run $RUN_ID: records, AI labels and review workbook"
          git push -u origin "$BR"
          {
            echo "Automated search run **$RUN_ID** (pillar $PILLAR; $DATABASES)."
            echo
            echo '```'; cat counts.txt download.txt ingest.txt label.txt review.txt; echo '```'
            echo
            echo "Review: open \`data/screening/${RUN_ID}_review.xlsx\`, fill the decision column on both tabs, then run"
            echo "\`python3 review.py apply --run $RUN_ID --sheet <returned.xlsx>\` and commit before merging."
            echo "Nothing reaches the site until this is merged; the PRISMA flow then counts the run."
          } > body.md
          gh pr create --title "Search run $RUN_ID (pillar $PILLAR)" --body-file body.md --base main --head "$BR"
